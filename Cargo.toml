    [package]
    name = "fanwaave-lib-core"
    version = "0.1.0"
    edition = "2021"
    license = "MIT"
    description = "SeaORM boundary for Fanwaave on PostgreSQL and CockroachDB"
    repository = "https://github.com/fanwaave/fanwaave-lib-core"

    [features]
    default = ["read-only"]
    read-only = []
    read-write = ["read-only"]
    migrate = ["read-write"]
    diesel-projection = ["dep:chrono", "dep:diesel", "dep:pgvector", "dep:serde_json", "dep:uuid"]
    sea-orm-projection = ["dep:sea-orm"]
    orm-projections = ["diesel-projection", "sea-orm-projection"]

    [dependencies]
    chrono = { version = "0.4", features = ["serde"], optional = true }
    diesel = { version = "=2.2.12", default-features = false, features = ["32-column-tables", "chrono", "postgres", "serde_json", "uuid"], optional = true }
    pgvector = { version = "=0.4.2", features = ["diesel", "halfvec", "serde"], optional = true }
    sea-orm = { version = "=1.1.20", default-features = false, features = ["macros", "postgres-vector", "with-chrono", "with-json", "with-uuid"], optional = true }
    serde = { version = "1", features = ["derive"] }
    serde_json = { version = "1", optional = true }
    thiserror = "2"
    uuid = { version = "1", features = ["serde"], optional = true }

[lints.rust]
unsafe_code = "forbid"
