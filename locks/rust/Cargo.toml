# Keep this generated crate independent when the consumer repository is a
# Cargo workspace that does not list locks/rust as a member.
[workspace]
resolver = "3"

[package]
name = "fanwaave-locks"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "fanwaave lock routines: ores-locks-and-leases with the fanwaave key prefix and lock catalog"
repository = "https://github.com/fanwaave/fanwaave-lib-core"

[lib]
path = "lib.rs"

[features]
default = []
pg = ["ores-locks-and-leases/pg"]
fiducia = ["ores-locks-and-leases/fiducia"]
full = ["pg", "fiducia"]

[dependencies]
ores-locks-and-leases = { git = "https://github.com/ORESoftware/ores-locks-and-leases.git", tag = "v0.1.1" }

[lints.rust]
unsafe_code = "forbid"
